name: Main Branch CI

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch gains leg/profile/racecar_run inputs so racecar can pick
#      the baseline vs instrumented arm (upstream's bare workflow_dispatch had no
#      way to express it).
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together (the internal pattern, cf. dummy-deployments).
#   3. permissions: id-token: write for the action's OIDC connect. `read-all`
#      cannot express a write scope, so the block is spelled out.
#   4. A fail-closed assertion on the instrumented arm.
#   5. macos-latest dropped from the matrix: observables are linux-only.
#   6. Upstream gates the job on `github.repository == 'flutter/samples'`, which
#      is false in this fork and would skip every job. Removed.
# Build and test COMMANDS are byte-identical to upstream.

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *" # Every day at midnight

run-name: "Main Branch CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

defaults:
  run:
    shell: bash

jobs:
  flutter-tests:
    name: Test Flutter ${{ matrix.flutter_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        flutter_version: [stable, beta]
        os: [ubuntu-latest]
    steps:
      - uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS.
          lfs: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected, so an empty LD_PRELOAD inside the
      # shell is what SUCCESS looks like. pgrep is no good either -- co-hostd
      # daemonizes under another name.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046
        with:
          channel: ${{ matrix.flutter_version }}
      - run: flutter pub get && dart tool/ci_script.dart
